spring.application.name=radar-ofertas-juegos
server.port=${PORT:8081}

# Configura MONGODB_URI en Render/Railway (en local usa --spring.profiles.active=local)
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/radar_ofertas}
spring.data.mongodb.auto-index-creation=true

# Carga automática de 10 páginas (~600 ofertas JSON) si la colección está vacía al iniciar
app.seed-on-startup=true
app.seed-pages=10

